<div id="addr" onclick="copyAddr()" style="border: 2px solid black; padding: 20px; font-size: 20px; cursor: pointer; word-break: break-all;">
bc1qvdtas4azfw7umdetl6t7q95ttw46ufugtmnm2l
</div>

<p id="msg">(click the box to copy)</p>

<script>
var ADDRESS = "bc1qvdtas4azfw7umdetl6t7q95ttw46ufugtmnm2l";
var QRTEXT = "(click the qr to copy the image)";
var ADDRTEXT = "(click the box to copy)";

function flash(id, text, back) {
  var el = document.getElementById(id);
  el.textContent = text;
  setTimeout(function () { el.textContent = back; }, 1500);
}

function copyAddr() {
  function done() { flash("msg", "copied!", ADDRTEXT); }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = ADDRESS;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS).then(done, fallback);
  } else {
    fallback();
  }
}

function copyImg() {
  var canCopyImage = navigator.clipboard && window.ClipboardItem && window.isSecureContext;
  if (!canCopyImage) {
    flash("qrmsg", "cant copy images here - copied the address instead", QRTEXT);
    copyAddrQuiet();
    return;
  }
  var img = document.getElementById("qr");
  var canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.getContext("2d").drawImage(img, 0, 0);
  canvas.toBlob(function (blob) {
    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(
      function () { flash("qrmsg", "image copied!", QRTEXT); },
      function () {
        flash("qrmsg", "cant copy images here - copied the address instead", QRTEXT);
        copyAddrQuiet();
      }
    );
  }, "image/png");
}

function copyAddrQuiet() {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS);
  } else {
    var ta = document.createElement("textarea");
    ta.value = ADDRESS;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
}
</script>
