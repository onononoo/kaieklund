<script>
var ADDRESS = "bc1qvdtas4azfw7umdetl6t7q95ttw46ufugtmnm2l";
var flashTimer;

// Briefly show a message in the address box, then put the address back.
function flash(text) {
  var el = document.getElementById("addr");
  el.textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { el.textContent = ADDRESS; }, 1500);
}

function copyAddr() {
  function done() { flash("address copied!"); }
  function fallback() {
    if (legacyCopy()) { done(); }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS).then(done, fallback);
  } else {
    fallback();
  }
}

function qrBlob() {
  return new Promise(function (resolve) {
    var img = document.getElementById("qr");
    var canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    canvas.toBlob(resolve, "image/png");
  });
}

function copyImg() {
  function fellBack() {
    flash("cant copy images here - copied the address instead");
    copyAddrQuiet();
  }
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && window.isSecureContext)) {
    fellBack();
    return;
  }
  try {
    // ClipboardItem takes the promise, so write() runs inside the click's
    // user activation - awaiting toBlob() first loses it and Chrome throws.
    var item = new ClipboardItem({ "image/png": qrBlob() });
    navigator.clipboard.write([item]).then(
      function () { flash("qr image copied!"); },
      fellBack
    );
  } catch (e) {
    fellBack();
  }
}

function copyAddrQuiet() {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS).catch(legacyCopy);
  } else {
    legacyCopy();
  }
}

function legacyCopy() {
  var ta = document.createElement("textarea");
  ta.value = ADDRESS;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

</script>
