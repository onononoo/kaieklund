<script>
var ADDRESS = "bc1qvdtas4azfw7umdetl6t7q95ttw46ufugtmnm2l";
var QRTEXT = "(click the qr to copy the image)";
var ADDRTEXT = "(click the box to copy)";

function flash(id, text, back) {
  var el = document.getElementById(id);
  el.textContent = text;
  setTimeout(function () { el.textContent = back; }, 1500);
}

function copyAddr() {
  function done() { flash("msg", "copied!", ADDRTEXT); }
  function fallback() {
    if (legacyCopy()) { done(); }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS).then(done, fallback);
  } else {
    fallback();
  }
}

function qrBlob() {
  return new Promise(function (resolve) {
    var img = document.getElementById("qr");
    var canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
    canvas.toBlob(resolve, "image/png");
  });
}

function copyImg() {
  function fellBack() {
    flash("qrmsg", "cant copy images here - copied the address instead", QRTEXT);
    copyAddrQuiet();
  }
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && window.isSecureContext)) {
    fellBack();
    return;
  }
  try {
    // ClipboardItem takes the promise, so write() runs inside the click's
    // user activation - awaiting toBlob() first loses it and Chrome throws.
    var item = new ClipboardItem({ "image/png": qrBlob() });
    navigator.clipboard.write([item]).then(
      function () { flash("qrmsg", "image copied!", QRTEXT); },
      fellBack
    );
  } catch (e) {
    fellBack();
  }
}

function copyAddrQuiet() {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(ADDRESS).catch(legacyCopy);
  } else {
    legacyCopy();
  }
}

function legacyCopy() {
  var ta = document.createElement("textarea");
  ta.value = ADDRESS;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

</script>
